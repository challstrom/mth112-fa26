author: "Chris Hallstrom"

format:
  revealjs:
     html-math-method: mathjax
     theme: [default, mth112slides.scss]
     transition: fade
     slide-number: true
     chalkboard: true
     highlight-style: a11y-dark

editor: visual
execute:
  freeze: auto
  echo: true
  warning: true
knitr:
  opts_chunk: 
    R.options:
      width: 90